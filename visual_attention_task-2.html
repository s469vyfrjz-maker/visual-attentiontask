<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>視覚的注意・四角の記憶課題</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;margin:0;background:#f3f5f8;color:#172033}
  main{max-width:900px;margin:0 auto;padding:20px}
  h1{font-size:1.35rem;margin:0 0 8px}
  .hint{font-size:.95rem;color:#4b5563;line-height:1.6}
  .toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}
  #stage{height:min(62vh,500px);min-height:330px;background:white;border:1px solid #d7dce5;border-radius:16px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  #stimulus{position:absolute;inset:0}
  #message{position:relative;z-index:1;text-align:center;font-size:1.1rem}
  .arrow{font-size:clamp(110px,22vw,190px);font-weight:900;line-height:1;color:#111827}
  .controls{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:16px 0}
  button{font:inherit;border:1px solid #c7ced9;border-radius:10px;padding:11px 22px;background:#fff;cursor:pointer}
  button.primary{background:#2563eb;color:white;border-color:#2563eb;font-weight:700}
  button:disabled{opacity:.45;cursor:not-allowed}
  #status{text-align:center;min-height:1.5em;margin:10px 0}
  .small{font-size:.82rem;color:#667085;line-height:1.6}
  @media(max-width:600px){main{padding:12px}#stage{min-height:300px}}
</style>
</head>
<body>
<main>
  <h1>視覚的注意・四角の記憶課題</h1>
  <div class="hint">矢印 200ms → 記憶配列 100ms → 空白（保持）900ms → テスト配列 最大2000ms<br><strong>回答キー：F = 同じ ／ J = 違う</strong></div>
  <div class="toolbar"><strong id="progress">試行 0 / 20</strong><span id="score">正答 0</span></div>
  <div id="stage"><div id="stimulus"></div><div id="message">「開始」を押してください</div></div>
  <div class="controls">
    <button id="start" class="primary">開始</button>
    <button id="same" disabled>同じ</button>
    <button id="diff" disabled>違う</button>
  </div>
  <div id="status" aria-live="polite">テスト配列が記憶配列と同じか違うかを、Fキー・Jキーで回答します。</div>
  <div class="controls">
    <button id="csv" disabled>結果をCSV保存</button>
    <button id="reset">リセット</button>
  </div>
  <p class="small">注意：矢印は大きく表示されます。矢印後に別の空白画面は挟まず、記憶配列を直ちに提示します。テスト配列は回答すると早めに終了し、2000ms以内に回答がない場合は時間切れになります。画面の表示時間は端末やブラウザの処理状況に左右されるため、厳密な実験計測には専用実験ソフトでの検証が必要です。</p>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage=$('stage'), stimulus=$('stimulus'), message=$('message');
  const startBtn=$('start'), sameBtn=$('same'), diffBtn=$('diff'), csvBtn=$('csv'), resetBtn=$('reset');
  const progress=$('progress'), scoreEl=$('score'), status=$('status');
  const N=20, COLORS=['#e53935','#1976d2','#43a047','#f9a825','#8e24aa','#00acc1'];
  let trials=[], index=0, results=[], running=false, answered=false, timer=null, responseStart=0;
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function clear(){stimulus.replaceChildren();message.textContent='';message.className='';}
  function showMessage(text, arrow=false){clear();message.textContent=text;if(arrow)message.className='arrow';}
  function buttons(enabled){sameBtn.disabled=!enabled;diffBtn.disabled=!enabled;}
  function positions(n){
    const out=[]; let tries=0;
    while(out.length<n && tries++<1500){
      const p={x:7+Math.random()*86,y:7+Math.random()*82};
      if(out.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>18))out.push(p);
    }
    return out;
  }
  function array(){
    return positions(4).map(p=>({x:p.x,y:p.y,c:COLORS[Math.floor(Math.random()*COLORS.length)]}));
  }
  function draw(items){
    clear();
    items.forEach(s=>{
      const el=document.createElement('div');
      Object.assign(el.style,{position:'absolute',left:s.x+'%',top:s.y+'%',width:'24px',height:'24px',background:s.c,border:'1px solid rgba(0,0,0,.15)',transform:'translate(-50%,-50%)',borderRadius:'2px'});
      stimulus.appendChild(el);
    });
  }
  function newTrial(){
    const memory=array(),changed=Math.random()<.5,test=memory.map(s=>({...s}));
    if(changed){
      const i=Math.floor(Math.random()*test.length);
      if(Math.random()<.5){
        let c; do{c=COLORS[Math.floor(Math.random()*COLORS.length)]}while(c===test[i].c);
        test[i].c=c;
      }else{
        let p,tries=0;
        do{p={x:7+Math.random()*86,y:7+Math.random()*82};tries++}
        while(tries<100&&test.some((s,j)=>j!==i&&Math.hypot(s.x-p.x,s.y-p.y)<18));
        test[i].x=p.x;test[i].y=p.y;
      }
    }
    return {arrow:Math.random()<.5?'←':'→',memory,test,changed};
  }
  async function runTrial(){
    if(!running)return;
    if(index>=N){finish();return;}
    answered=false;buttons(false);progress.textContent=`試行 ${index+1} / ${N}`;
    const t=trials[index];
    showMessage(t.arrow,true); await wait(200);
    if(!running)return;
    draw(t.memory); await wait(100);
    if(!running)return;
    showMessage(''); await wait(900);
    if(!running)return;
    draw(t.test); responseStart=performance.now(); buttons(true);
    status.textContent='同じ？ 違う？';
    timer=setTimeout(()=>{
      if(!answered&&running){
        answered=true;buttons(false);
        results.push({trial:index+1,arrow:t.arrow,correct_answer:t.changed?'違う':'同じ',response:'無回答',correct:false,rt_ms:''});
        status.textContent='時間切れ'; showMessage('時間切れ'); index++;
        updateScore(); setTimeout(runTrial,350);
      }
    },2000);
  }
  function respond(choice){
    if(!running||answered||index>=N)return;
    answered=true;clearTimeout(timer);buttons(false);
    const t=trials[index],rt=Math.round(performance.now()-responseStart);
    const correctAnswer=t.changed?'違う':'同じ',correct=choice===correctAnswer;
    results.push({trial:index+1,arrow:t.arrow,correct_answer:correctAnswer,response:choice,correct,rt_ms:rt});
    showMessage(correct?'○':'×');status.textContent=`${correct?'正解':'不正解'}（反応時間 ${rt} ms）`;
    index++;updateScore();setTimeout(runTrial,350);
  }
  function updateScore(){scoreEl.textContent=`正答 ${results.filter(r=>r.correct).length}`;}
  function finish(){
    running=false;buttons(false);showMessage('終了');progress.textContent=`試行 ${N} / ${N}`;
    status.textContent=`終了：${results.filter(r=>r.correct).length} / ${N} 問正解`;
    startBtn.disabled=false;startBtn.textContent='もう一度';csvBtn.disabled=results.length===0;
  }
  function begin(){
    clearTimeout(timer);trials=Array.from({length:N},newTrial);index=0;results=[];running=true;
    startBtn.disabled=true;csvBtn.disabled=true;status.textContent='課題を実施中です。';updateScore();runTrial();
  }
  function reset(){
    clearTimeout(timer);running=false;index=0;results=[];trials=[];answered=false;buttons(false);
    startBtn.disabled=false;startBtn.textContent='開始';csvBtn.disabled=true;progress.textContent='試行 0 / 20';scoreEl.textContent='正答 0';
    showMessage('「開始」を押してください');status.textContent='テスト配列が記憶配列と同じか違うかを、Fキー・Jキーで回答します。';
  }
  startBtn.addEventListener('click',begin);
  sameBtn.addEventListener('click',()=>respond('同じ'));
  diffBtn.addEventListener('click',()=>respond('違う'));
  resetBtn.addEventListener('click',reset);
  csvBtn.addEventListener('click',()=>{
    const cols=['trial','arrow','correct_answer','response','correct','rt_ms'];
    const lines=[cols.join(','),...results.map(r=>cols.map(k=>String(r[k]??'')).join(','))];
    const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='visual_attention_results.csv';a.click();URL.revokeObjectURL(url);
  });
})();
</script>
</body>
</html>
